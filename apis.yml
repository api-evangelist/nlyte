aid: nlyte
name: nlyte
description: nlyte is an enterprise Data Center Infrastructure Management (DCIM) software
  provider, now part of Carrier, that helps organizations discover, model, and manage
  physical and virtual data-center assets, capacity, power, cooling, connectivity, and
  operational workflows across facilities. Nlyte products expose REST APIs (including
  the NgageAPI / Ngauge web service) plus a portfolio of pre-built bi-directional connectors
  for CMDB, ITSM, service desk, virtualization, and building-management systems. The API
  is delivered to customers through the Nlyte customer portal rather than a public
  developer program, so there is no open developer portal, OpenAPI definition, or self-serve sign-up.
